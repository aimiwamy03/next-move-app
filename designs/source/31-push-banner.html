<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;background:#F4EFE6;font-family:'DM Sans',sans-serif;color:#2B2A26;overflow:hidden}
.s{width:390px;height:844px;padding:18px 24px 28px;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;font-size:17px;font-weight:600;color:#35493B;height:20px}
.status .b{font-family:'Fraunces',serif;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.over{font-size:17px;letter-spacing:1px;font-weight:700;color:#8E4A2C}
.back{font-size:17px;color:#35493B;font-weight:600;display:flex;align-items:center;gap:6px;min-height:44px}
h1{font-family:'Fraunces',serif;font-weight:600;color:#35493B;font-size:32px;line-height:1.15;margin-top:8px}
h2{font-family:'Fraunces',serif;font-weight:600;color:#35493B;font-size:22px;line-height:1.2}
p,.body{font-size:17px;line-height:1.4}
.muted{color:#5E5B53}
.small{font-size:17px;line-height:1.35}
.card{background:#FEFBF5;border-radius:12px;box-shadow:0 4px 18px rgba(53,73,59,.08);border:1px solid #ECE4D6}
.bar{height:8px;background:#E3DCCF;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#B66947;border-radius:4px}
.bar.g i{background:#35493B}
.tag{display:inline-flex;align-items:center;gap:8px;background:#E3E9DC;color:#35493B;font-weight:700;font-size:17px;padding:7px 12px;border-radius:8px}
.tag .dot{width:10px;height:10px;border-radius:5px;background:#35493B}
.tag.t{background:#F6E6DC;color:#8E4A2C}.tag.t .dot{background:#B66947}
.btn{height:60px;border-radius:8px;background:#B66947;color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;width:100%}
.btn2{height:56px;border-radius:8px;background:#E3E9DC;color:#35493B;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;width:100%}
.btn3{height:52px;border-radius:8px;border:1.5px solid #35493B;color:#35493B;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;width:100%;background:transparent}
.num{width:32px;height:32px;border-radius:8px;background:#E3E9DC;color:#35493B;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none}
.tabs{display:flex;gap:22px;border-bottom:1px solid #DCD3C3;margin-top:18px}
.tabs div{font-size:17px;font-weight:600;color:#5E5B53;padding:10px 0 12px;min-height:44px}
.tabs .on{color:#35493B;border-bottom:3px solid #B66947;margin-bottom:-1px}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:64px}
.chev{flex:none}
.spacer{flex:1}

.s.tb{padding-bottom:96px;position:relative}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#FEFBF5;border-top:1px solid #DCD3C3;display:flex;justify-content:space-around;padding-top:8px}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:17px;font-weight:600;color:#5E5B53;padding-bottom:4px;min-width:64px}
.tabbar .on{color:#35493B;font-weight:700}
.tabbar .on span{border-bottom:3px solid #B66947;padding-bottom:2px}
.lbl{font-size:17px;color:#5E5B53}
.val{font-size:17px;font-weight:700;color:#2B2A26;text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #EDE6DA}
.kv:last-child{border-bottom:none}
.ovr{height:76px;border-radius:8px;background:#B66947;color:#fff;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:3px solid #7A3A20;box-shadow:0 6px 0 #7A3A20}
.link{font-size:17px;font-weight:700;color:#35493B;text-decoration:underline;min-height:44px;display:flex;align-items:center}
.av{width:44px;height:44px;border-radius:22px;background:#35493B;color:#fff;font-family:'Fraunces',serif;font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}

.lock{width:390px;height:844px;position:relative;overflow:hidden;background:linear-gradient(170deg,#2E4234 0%,#35493B 45%,#4A5F4E 100%);padding:26px 16px;display:flex;flex-direction:column;align-items:center}
.n{width:100%;background:rgba(254,251,245,.94);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.n .t{font-size:17px;font-weight:500;color:#2B2A26;line-height:1.3}.n .b{font-size:17px;color:#3F3D38;line-height:1.35}
.n .h{display:flex;justify-content:space-between;font-size:17px;color:#5E5B53;font-weight:500;margin-bottom:2px}
.appic{width:40px;height:40px;border-radius:9px;background:#35493B;flex:none;display:flex;align-items:center;justify-content:center}
