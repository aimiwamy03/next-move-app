<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-size:17px;width:390px;height:844px;background:#F4EFE6;font-family:'DM Sans',sans-serif;font-weight:400;color:#2B2A26;overflow:hidden}
.s{width:390px;height:844px;padding:16px 28px 26px;display:flex;flex-direction:column;position:relative}
.st{font-size:17px;font-weight:500;color:#2B2A26;height:22px}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-top:10px;font-size:17px;color:#5E5B53}
.prog{display:flex;gap:6px;margin-top:6px}.prog i{flex:1;height:4px;border-radius:2px;background:#DCD3C3}.prog i.d{background:#35493B}.prog i.c{background:#B66947}
.eye{font-size:17px;font-weight:500;color:#8E4A2C}
h1{font-family:'Lora',serif;font-weight:500;font-size:30px;line-height:1.25;color:#2E3A31}
h2{font-family:'Lora',serif;font-weight:500;font-size:22px;line-height:1.3;color:#2E3A31}
p,.p{font-size:17px;line-height:1.5}.mu{color:#5E5B53}
.opt{min-height:72px;border-radius:12px;background:#FEFBF5;border:1.5px solid #E6DED0;display:flex;align-items:center;gap:14px;padding:12px 18px}
.opt.on{background:#E3E9DC;border-color:#35493B}
.opt .tt{font-size:20px;font-weight:500}.opt .ss{font-size:17px;color:#5E5B53}
.box{width:24px;height:24px;border-radius:6px;border:1.5px solid #B9B0A0;flex:none;display:flex;align-items:center;justify-content:center}
.opt.on .box{background:#35493B;border-color:#35493B}
.cta{height:60px;border-radius:12px;background:#35493B;color:#fff;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:space-between;padding:0 22px;width:100%}
.cta.t{background:#A65B3B}.cta.c{justify-content:center;gap:10px}
.ghost{height:56px;border-radius:12px;border:1.5px solid #35493B;color:#35493B;font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;width:100%}
.tiny{font-size:17px;color:#6B675E;text-align:center;margin-top:12px}
.link{font-size:17px;font-weight:500;color:#35493B;text-decoration:underline;text-underline-offset:4px;min-height:44px;display:flex;align-items:center;justify-content:center}
.card{background:#FEFBF5;border-radius:16px;border:1px solid #ECE4D6}
.sp{flex:1}
.row{display:flex;align-items:center;justify-content:space-between;min-height:64px;border-bottom:1px solid #E6DED0;font-size:18px}
.av{width:56px;height:56px;border-radius:28px;background:#E3E9DC;color:#35493B;font-family:Lora,serif;font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center}
.ovr{height:76px;border-radius:12px;background:#A65B3B;color:#fff;display:flex;align-items:center;gap:14px;width:100%;padding:0 20px}
.ovr b{font-size:20px;font-weight:500;display:block}.ovr span{font-size:17px;display:block}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:80px;background:#FEFBF5;border-top:1px solid #E6DED0;display:flex;justify-content:space-around;padding-top:12px}
.tabbar div{font-size:17px;color:#5E5B53;padding-bottom:4px;height:28px}.tabbar .on{color:#35493B;font-weight:500;border-bottom:2px solid #B66947}
</style></head><body><div class="s" style=""><div class="st">12:16</div><div class="nav"><span class="eye" data-n="who">On the call</span><span data-n="timer" style="color:#2B2A26;font-weight:500">4:12</span></div>
<div class="sp" style="max-height:60px"></div>
<div style="width:64px;height:64px;border-radius:32px;background:#E3E9DC;display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#35493B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c2.5-3 4.5-3 7 0s4.5 3 7 0 2.5-2 4-2"/><path d="M3 15c2.5-3 4.5-3 7 0s4.5 3 7 0 2.5-2 4-2" opacity=".7"/></svg></div>
<p class="mu" style="margin-top:22px">It is asking</p>
<h1 style="margin-top:6px" data-n="ask">Who lives with you? Do you buy and cook food together?</h1>
<p class="mu" style="margin-top:12px">You can say "just me" or "skip."</p>
<div class="sp"></div>
<div class="ovr" data-n="ovr"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10c2.5-3 4.5-3 7 0s4.5 3 7 0 2.5-2 4-2"/><path d="M3 15c2.5-3 4.5-3 7 0s4.5 3 7 0 2.5-2 4-2" opacity=".7"/></svg><div><b>I'm overwhelmed</b><span>Pause and breathe. One tap.</span></div></div>
<div class="link" style="margin-top:8px" data-n="end">End call</div></div></body></html>
